<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- mobile : pas de zoom au double toucher, le jeu occupe tout l'écran (y compris sous l'encoche) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2a2420">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Muraille">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icone-192.png">
  <link rel="apple-touch-icon" href="assets/icone-180.png">
  <title>Muraille</title>
  <link rel="preload" href="assets/polices/PermanentMarker-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/polices/CaveatBrush-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    /* calligraphie du jeu : polices libres embarquées (licences dans assets/polices/) */
    @font-face { font-family: 'Pinceau'; src: url('assets/polices/PermanentMarker-Regular.ttf') format('truetype'); font-display: block; }
    @font-face { font-family: 'Plume'; src: url('assets/polices/CaveatBrush-Regular.ttf') format('truetype'); font-display: block; }
    html, body { margin: 0; height: 100%; background: #2a2420; overflow: hidden; overscroll-behavior: none; }
    body { display: flex; align-items: center; justify-content: center; height: 100vh; height: 100dvh; }
    canvas {
      display: block; height: auto; background: #ece3cf; cursor: default;
      width: min(100vw, calc(100vh * 0.75));
      width: min(100vw, calc(100dvh * 0.75));
      /* tactile : ni défilement, ni zoom, ni sélection, ni menu d'appui long */
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <canvas id="jeu" width="720" height="960"></canvas>
  <script>
    // Téléphone en portrait plus allongé que 3:4 : le jeu prend toute la hauteur (720 de large, jusqu'à 1 600 de
    // haut) ; la vallée s'allonge d'autant. Sur ordinateur, 720 × 960. Pour tester : index.html?hauteur=1500
    (function () {
      const c = document.getElementById('jeu'), forcee = +new URLSearchParams(location.search).get('hauteur');
      const tactile = window.matchMedia && matchMedia('(pointer: coarse)').matches, ratio = innerHeight / innerWidth;
      const h = forcee ? Math.max(960, Math.min(1600, Math.round(forcee))) : tactile && ratio > 1.4 ? Math.min(1600, Math.round(720 * ratio)) : 960;
      c.height = h;
      const largeur = `min(100vw, calc(100dvh * ${(720 / h).toFixed(4)}))`;
      c.style.width = `min(100vw, calc(100vh * ${(720 / h).toFixed(4)}))`; c.style.width = largeur;
    })();
  </script>
  <script>
    // Le jeu dessine des images au démarrage (cartes, bandeaux…) : on attend les deux polices calligraphiées
    // (au plus 2,5 s, puis on démarre quand même avec les polices de secours).
    (function () {
      // VERSION : à changer à chaque mise en ligne, pour que les navigateurs prennent les nouveaux scripts
      // (GitHub Pages les garde sinon 10 minutes en cache).
      const VERSION = '2026-11-13h';
      const scripts = ['musique/combat.js', 'musique/effets.js', 'src/main.js'];
      const charger = () => (function suivant(i) {
        if (i >= scripts.length) return;
        const s = document.createElement('script'); s.src = scripts[i] + '?v=' + VERSION;
        s.onload = s.onerror = () => suivant(i + 1);
        document.body.appendChild(s);
      })(0);
      const polices = document.fonts ? Promise.all([document.fonts.load("20px 'Pinceau'"), document.fonts.load("20px 'Plume'")]) : Promise.resolve();
      Promise.race([polices, new Promise(r => setTimeout(r, 2500))]).then(charger, charger);
    })();
  </script>
</body>
</html>
